<html lang="fr">
<head>

<title>TdVN4 — Compétences</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#060610;font-family:Georgia,'Times New Roman',serif;color:#9090b8}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
#vglow{position:fixed;inset:0;pointer-events:none;z-index:1;transition:background 0.8s ease}
#toggle{position:fixed;left:0;top:0;bottom:0;width:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-right:1px solid #0d0d22;background:rgba(4,4,12,.88);z-index:300;transition:background .2s}
#toggle:hover{background:rgba(7,7,18,.96)}
#arrow{font-size:16px;color:#1c1c40;transition:transform .32s cubic-bezier(.4,0,.2,1),color .2s}
#toggle:hover #arrow{color:#4040b0}
#toggle.open #arrow{transform:rotate(180deg);color:#4040c0}
#panel{position:fixed;left:36px;top:0;bottom:0;width:230px;background:rgba(3,3,11,.97);border-right:1px solid #0b0b1e;transform:translateX(-230px);transition:transform .32s cubic-bezier(.4,0,.2,1);z-index:200;overflow-y:auto;padding:15px 9px}
#panel.open{transform:translateX(0)}
.p-title{font-size:.42em;letter-spacing:4px;color:#0e0e28;text-transform:uppercase;text-align:center;margin-bottom:12px}
.c-item{padding:7px 9px;margin-bottom:3px;cursor:pointer;border:1px solid transparent;border-radius:3px;font-size:.56em;letter-spacing:1.5px;text-transform:uppercase;color:#17173a;transition:all .15s}
.c-item:hover{color:var(--cc);border-color:var(--cc-d)}
.c-item.active{color:var(--cc);border-color:var(--cc);background:var(--cc-b)}
.c-sep{height:1px;background:#0a0a1e;margin:7px 3px}
.w-list{padding-left:10px;overflow:hidden;max-height:0;transition:max-height .25s ease}
.w-list.open{max-height:130px}
.w-item{padding:4px 7px;margin-bottom:2px;cursor:pointer;font-size:.52em;letter-spacing:1.5px;text-transform:uppercase;color:#131330;transition:color .15s}
.w-item:hover,.w-item.active{color:var(--cc)}
#main{position:fixed;left:36px;top:0;right:0;bottom:0;display:flex;flex-direction:column;z-index:10}
#topbar{height:54px;flex-shrink:0;display:flex;align-items:center;padding:0 18px;gap:11px;border-bottom:1px solid #0b0b1e;background:rgba(3,3,10,.6)}
#wicons{display:flex;gap:6px;align-items:center}
.wicon{width:36px;height:36px;border-radius:50%;border:1px solid #0f0f25;cursor:pointer;display:flex;align-items:center;justify-content:center;background:rgba(3,3,13,.6);transition:all .2s}
.wicon:hover{border-color:var(--cc-d)}
.wicon.active{border-color:var(--cc);background:var(--cc-b);box-shadow:0 0 9px var(--cc-b)}
#wname{margin-left:9px;font-size:.88em;letter-spacing:6px;text-transform:uppercase;color:var(--cc);text-shadow:0 0 15px var(--cc-d);transition:all .25s}
#tc{flex:1;overflow:hidden;position:relative;cursor:grab}
#tc:active{cursor:grabbing}
#tsvg-wrap{position:absolute;top:0;left:0;transform-origin:0 0}
#tt{position:fixed;pointer-events:none;background:rgba(3,3,13,.97);border-left:2px solid var(--cc);padding:10px 13px;max-width:235px;z-index:500;opacity:0;transition:opacity .13s}
#tt.vis{opacity:1}
#tt-type{font-size:.44em;letter-spacing:2.5px;color:#0d0d2c;text-transform:uppercase;margin-bottom:4px}
#tt-name{font-size:.67em;letter-spacing:2px;color:var(--cc);text-transform:uppercase;margin-bottom:6px}
#tt-sep{height:1px;background:var(--cc-d);margin-bottom:6px}
#tt-lvl{font-size:.52em;letter-spacing:1.5px;color:var(--cc);opacity:.65;margin-bottom:6px;display:none}
#tt-desc{font-size:.6em;color:#303050;line-height:1.75}
#zc{position:fixed;bottom:14px;right:14px;display:flex;flex-direction:column;gap:3px;z-index:100}
.zbtn{width:27px;height:27px;background:rgba(3,3,13,.9);border:1px solid #0d0d24;color:#171740;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:3px;transition:all .14s}
.zbtn:hover{color:#5050cc;border-color:#2020a0}
</style>
</head>

(()=>{const cv=document.getElementById('stars'),ctx=cv.getContext('2d');let st=[];
function init(){cv.width=innerWidth;cv.height=innerHeight;st=Array.from({length:220},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.1+.15,a:Math.random(),sp:(Math.random()*.007+.002)*(Math.random()>.5?1:-1)}))}

/* ── HELPERS DONNÉES ── */
function buildW(name,sym,lA,lB,ct,tmpl){
  const na=tmpl.sA.map((n,i)=>({...n,...c2n(ct[i])}));
  const nb=tmpl.sB.map((n,i)=>({...n,...c2n(ct[15+i])}));
  return{name,sym,lA,lB,nodes:[...na,...nb],edges:[...tmpl.eA,...tmpl.eB]};
}
function c2n(c){return{name:c[0],desc:c[1]||""}}
const ph=n=>[n,"Description à venir."];
function ab(n){return n.split(' ').map(w=>w[0]).join('').substring(0,3).toUpperCase()}
function hexRgb(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return{r,g,b}}

/* ── ÉTAT ── */
let S={cls:"predateur",wi:0,scale:1,tx:0,ty:0,dragging:false,dsx:0,dsy:0,panelOpen:false};

/* ── COULEURS + TEINTE FOND ── */
function setColor(c){
  const root=document.documentElement.style;
  root.setProperty('--cc',c);root.setProperty('--cc-d',c+'55');root.setProperty('--cc-b',c+'12');
  const {r,g,b}=hexRgb(c);
  document.getElementById('vglow').style.background=
    `radial-gradient(ellipse 75% 70% at 55% 60%,rgba(${r},${g},${b},.2) 0%,transparent 65%),`+
    `radial-gradient(ellipse 45% 40% at 18% 18%,rgba(${r},${g},${b},.07) 0%,transparent 55%)`;
}

/* ── PANNEAU ── */
function togglePanel(){S.panelOpen=!S.panelOpen;document.getElementById('panel').classList.toggle('open',S.panelOpen);document.getElementById('toggle').classList.toggle('open',S.panelOpen)}
function buildPanel(){
  const cl=document.getElementById('clist');cl.innerHTML='';
  CLASSES.forEach(cls=>{
    if(cls.special){const d=document.createElement('div');d.className='c-sep';cl.appendChild(d)}
    const el=document.createElement('div');
    el.className='c-item'+(S.cls===cls.id?' active':'');
    el.style.cssText=`--cc:${cls.color};--cc-d:${cls.color}55;--cc-b:${cls.color}12`;
    el.textContent=(cls.special?'★ ':'')+cls.label;
    el.onclick=()=>selectClass(cls.id);cl.appendChild(el);
    const wl=document.createElement('div');wl.className='w-list'+(S.cls===cls.id?' open':'');wl.id='wl-'+cls.id;
    cls.w.forEach((w,wi)=>{const we=document.createElement('div');we.className='w-item'+(S.cls===cls.id&&S.wi===wi?' active':'');we.style.cssText=`--cc:${cls.color}`;we.textContent='· '+w.name;we.onclick=e=>{e.stopPropagation();selectWeapon(cls.id,wi)};wl.appendChild(we)});
    cl.appendChild(wl);
  });
}
function selectClass(id){S.cls=id;S.wi=0;buildPanel();renderAll();document.getElementById('wl-'+id).classList.add('open')}
function selectWeapon(id,wi){S.cls=id;S.wi=wi;buildPanel();renderAll()}

/* ── TOP BAR ── */
function renderTopBar(cls,wpn){
  const wi=document.getElementById('wicons');wi.innerHTML='';
  cls.w.forEach((w,i)=>{const b=document.createElement('div');b.className='wicon'+(S.wi===i?' active':'');b.innerHTML=`<svg viewBox="0 0 30 30" width="20" height="20">${SYM[w.sym](cls.color+(S.wi===i?'':'44'))}</svg>`;b.onclick=()=>selectWeapon(cls.id,i);wi.appendChild(b)});
  document.getElementById('wname').textContent=wpn.name;
}

/* ── ARBRE SVG ── */
function renderTree(cls,wpn){
  const c=cls.color;
  let h=`<defs><filter id="gw" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
  // Labels de section
  h+=`<text x="205" y="18" text-anchor="middle" font-size="9" letter-spacing="3" font-family="Georgia,serif" fill="${c}" fill-opacity=".42">${wpn.lA}</text>`;
  h+=`<text x="640" y="18" text-anchor="middle" font-size="9" letter-spacing="3" font-family="Georgia,serif" fill="${c}" fill-opacity=".42">${wpn.lB}</text>`;
  // Arêtes
  wpn.edges.forEach(([fi,ti])=>{const f=wpn.nodes.find(n=>n.id===fi),t=wpn.nodes.find(n=>n.id===ti);if(f&&t)h+=`<line x1="${f.x}" y1="${f.y}" x2="${t.x}" y2="${t.y}" stroke="${c}" stroke-opacity=".2" stroke-width="1.5"/>`});
  // Nœuds (cercles)
  // Niveau requis calculé depuis la position verticale (plus bas = niveau plus élevé)
  const getLvl=y=>{if(y<80)return 1;if(y<160)return 15;if(y<230)return 30;if(y<300)return 50;if(y<370)return 65;if(y<440)return 80;return 100};
  wpn.nodes.forEach(n=>{
    const r=n.t==='key'?23:18,label=ab(n.name),lvl=getLvl(n.y);
    h+=`<g class="nd" data-name="${n.name.replace(/"/g,"'")}" data-desc="${(n.desc||'').replace(/"/g,"'")}" data-t="${n.t}" data-lvl="${lvl}">`;
    if(n.t==='key')h+=`<circle cx="${n.x}" cy="${n.y}" r="${r+7}" fill="none" stroke="${c}" stroke-opacity=".1" stroke-width=".8"/>`;
    h+=`<circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${c}" fill-opacity=".07" stroke="${c}" stroke-opacity=".38" stroke-width="1.5" class="nc"/>`;
    h+=`<circle cx="${n.x}" cy="${n.y}" r="${n.t==='key'?4:2.5}" fill="${c}" fill-opacity=".22"/>`;
    h+=`<text x="${n.x}" y="${n.y+1}" text-anchor="middle" dominant-baseline="middle" font-size="${n.t==='key'?7:6}" font-family="Georgia,serif" fill="${c}" fill-opacity=".48" letter-spacing=".5">${label}</text>`;
    h+=`</g>`;
  });
  document.getElementById('tsvg').innerHTML=h;
  attachListeners(c);
}
function attachListeners(c){
  document.querySelectorAll('.nd').forEach(g=>{
    const ci=g.querySelector('.nc'),isKey=g.dataset.t==='key';
    g.addEventListener('mouseenter',e=>{if(S.dragging)return;ci.setAttribute('stroke-opacity','1');ci.setAttribute('stroke-width','2.5');ci.setAttribute('fill-opacity','.17');ci.setAttribute('filter','url(#gw)');showTT(g.dataset.name,g.dataset.desc,isKey,g.dataset.lvl)});
    g.addEventListener('mousemove',e=>{if(!S.dragging)moveTT(e)});
    g.addEventListener('mouseleave',()=>{ci.setAttribute('stroke-opacity','.38');ci.setAttribute('stroke-width','1.5');ci.setAttribute('fill-opacity','.07');ci.removeAttribute('filter');hideTT()});
  });
}

/* ── TOOLTIP ── */
function showTT(n,d,k,lvl){
  document.getElementById('tt-type').textContent=k?'⊙ COMPÉTENCE CLÉ':'○ COMPÉTENCE';
  document.getElementById('tt-name').textContent=n;
  const lvlEl=document.getElementById('tt-lvl');
  lvlEl.textContent=lvl?`— Niveau ${lvl} nécessaire`:'';
  lvlEl.style.display=lvl?'block':'none';
  document.getElementById('tt-desc').textContent=d||'Description à venir.';
  document.getElementById('tt').classList.add('vis');
}
function hideTT(){document.getElementById('tt').classList.remove('vis')}
function moveTT(e){const t=document.getElementById('tt');t.style.left=Math.min(e.clientX+16,innerWidth-t.offsetWidth-5)+'px';t.style.top=Math.max(5,Math.min(e.clientY-t.offsetHeight/2,innerHeight-t.offsetHeight-5))+'px'}

/* ── ZOOM + PAN ── */
const tc=document.getElementById('tc'),wrap=document.getElementById('tsvg-wrap');
function applyT(){wrap.style.transform=`translate(${S.tx}px,${S.ty}px) scale(${S.scale})`}
function initCenter(){const r=tc.getBoundingClientRect();S.tx=(r.width-840)/2;S.ty=(r.height-500)/2;applyT()}
tc.addEventListener('wheel',e=>{e.preventDefault();const r=tc.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,f=e.deltaY>0?.88:1.14,ns=Math.max(.22,Math.min(5,S.scale*f)),ra=ns/S.scale;S.tx=mx-ra*(mx-S.tx);S.ty=my-ra*(my-S.ty);S.scale=ns;applyT()},{passive:false});
function doZoom(f){const r=tc.getBoundingClientRect(),mx=r.width/2,my=r.height/2,ns=Math.max(.22,Math.min(5,S.scale*f)),ra=ns/S.scale;S.tx=mx-ra*(mx-S.tx);S.ty=my-ra*(my-S.ty);S.scale=ns;applyT()}
tc.addEventListener('mousedown',e=>{S.dragging=true;S.dsx=e.clientX-S.tx;S.dsy=e.clientY-S.ty;hideTT()});
tc.addEventListener('mousemove',e=>{if(!S.dragging)return;S.tx=e.clientX-S.dsx;S.ty=e.clientY-S.dsy;applyT()});
tc.addEventListener('mouseup',()=>{S.dragging=false});
tc.addEventListener('mouseleave',()=>{S.dragging=false});
tc.addEventListener('touchstart',e=>{const t=e.touches[0];S.dragging=true;S.dsx=t.clientX-S.tx;S.dsy=t.clientY-S.ty},{passive:true});
tc.addEventListener('touchmove',e=>{if(!S.dragging)return;e.preventDefault();const t=e.touches[0];S.tx=t.clientX-S.dsx;S.ty=t.clientY-S.dsy;applyT()},{passive:false});
tc.addEventListener('touchend',()=>{S.dragging=false},{passive:true});

/* ── RENDER + INIT ── */
function renderAll(){const cls=CLASSES.find(c=>c.id===S.cls),wpn=cls.w[S.wi];setColor(cls.color);renderTopBar(cls,wpn);renderTree(cls,wpn)}
buildPanel();renderAll();initCenter();window.addEventListener('resize',initCenter);
</script>
</body>
